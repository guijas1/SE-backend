name: smartair

x-app: &app
  image: smartair:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true

services:
  api:
    <<: *app
    environment:
      SMARTAIR_DATABASE_PATH: /data/smartair.db
      SMARTAIR_POWER_AUTOMATE_URL: "${SMARTAIR_POWER_AUTOMATE_URL:-}"
      SMARTAIR_DEVICE_NAME: "${SMARTAIR_DEVICE_NAME:-SmartAir ESP32}"
      SMARTAIR_OFFLINE_AFTER_SECONDS: "${SMARTAIR_OFFLINE_AFTER_SECONDS:-12}"
      SMARTAIR_NOTIFICATION_CHECK_SECONDS: "${SMARTAIR_NOTIFICATION_CHECK_SECONDS:-2}"
      SMARTAIR_NOTIFICATION_TIMEOUT_SECONDS: "${SMARTAIR_NOTIFICATION_TIMEOUT_SECONDS:-10}"
      SMARTAIR_ALERT_COOLDOWN_SECONDS: "${SMARTAIR_ALERT_COOLDOWN_SECONDS:-300}"
      SMARTAIR_SUMMARY_INTERVAL_SECONDS: "${SMARTAIR_SUMMARY_INTERVAL_SECONDS:-0}"
      SMARTAIR_NOTIFICATION_TIMEZONE: "${SMARTAIR_NOTIFICATION_TIMEZONE:-America/Sao_Paulo}"
    ports:
      - "${SMARTAIR_API_PORT:-8080}:8080"
    volumes:
      - smartair-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    <<: *app
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      SMARTAIR_API_URL: http://api:8080
      SMARTAIR_OFFLINE_AFTER_SECONDS: "${SMARTAIR_OFFLINE_AFTER_SECONDS:-12}"
    ports:
      - "${SMARTAIR_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  smartair-data:
